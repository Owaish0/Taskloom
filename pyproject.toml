[project]
name = "taskloom"
version = "0.1.0"
description = "Distributed async task processing: FastAPI + Redis queues + independent workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "google-genai>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fakeredis>=2.24.0",
    "lupa>=2.1",  # fakeredis needs this to emulate Lua scripting (EVAL/EVALSHA)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskloom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
